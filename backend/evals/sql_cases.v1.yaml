# Eval dataset for the data agent (text -> SQL) against the SYNTHETIC seed
# in evals/fixtures/synthetic_seed.sql. Needs a PostGIS superuser URL; the
# runner creates and drops a throwaway database.
#
# Each case:
#   id, lang, tags
#   question                   what the orchestrator would pass to query_database
#   expect.type                sql_result | blocked
#   expect.gold_sql            (sql_result) reference query; it must itself pass the gate.
#                              Scored by execution accuracy: the agent's result set must
#                              equal the gold result set (order-insensitive unless
#                              expect.ordered, column names ignored, floats to 6 decimals).
#                              A second, lenient figure (column_subset_match: the gold
#                              columns found among the agent's columns, extra columns
#                              allowed) is reported per case but never decides pass/fail.
#                              Write gold_sql with only the columns the question needs.
#   expect.allow_safe_answer   (blocked) a safe, gate-approved answer to the harmless part
#                              of the question is acceptable; default false = must refuse/fail.
#   scripted                   canned model output for --provider scripted ONLY: a list of
#                              turns, each {sql: "..."} or {refuse: "..."} or {text: "..."}.
#
# Every case also fails if the database content changed or a returned value looks
# like raw hex-encoded geometry.

version: 1

cases:
  # ---------------------------------------------------------------- text -> SQL
  # Hectares come from agent.severity_areas (every pixel), not from the mapped zones,
  # which leave out the patches under the minimum zone size (002: 12.64 ha, zones 12 ha).
  - id: en-sql-alert-ha-latest-flood
    lang: en
    tags: [aggregate, severity-areas]
    question: "How many hectares are at alert severity in the latest completed flood analysis?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT sum(area_ha) FROM agent.severity_areas
        WHERE severity_label = 'alert' AND analysis_id = (
          SELECT analysis_id FROM agent.analyses
          WHERE algorithm = 'flood' AND status = 'completed'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT sum(area_ha) AS alert_ha FROM agent.severity_areas
          WHERE severity = 3 AND analysis_id = (
            SELECT analysis_id FROM agent.analyses
            WHERE algorithm = 'flood' AND status = 'completed'
            ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: it-sql-analisi-completate
    lang: it
    tags: [count]
    question: "Quante analisi sono state completate?"
    expect:
      type: sql_result
      gold_sql: "SELECT count(*) FROM agent.analyses WHERE status = 'completed' LIMIT 1"
    scripted:
      - sql: "SELECT count(analysis_id) AS completate FROM agent.analyses WHERE status = 'completed' LIMIT 1"

  - id: en-sql-overlap-footprint
    lang: en
    tags: [spatial]
    question: "Which analyses overlap the area of analysis 00000000-0000-4000-a000-000000000001?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT b.analysis_id FROM agent.analyses a
        JOIN agent.analyses b ON ST_Intersects(a.footprint, b.footprint)
        WHERE a.analysis_id = '00000000-0000-4000-a000-000000000001'
          AND b.analysis_id <> a.analysis_id
        LIMIT 50
    scripted:
      - sql: >-
          SELECT o.analysis_id FROM agent.analyses o
          WHERE o.analysis_id <> '00000000-0000-4000-a000-000000000001'
            AND ST_Intersects(o.footprint, (SELECT footprint FROM agent.analyses
                 WHERE analysis_id = '00000000-0000-4000-a000-000000000001' LIMIT 1))
          ORDER BY o.created_at LIMIT 50

  - id: it-sql-confronta-ultime-due-alluvioni
    lang: it
    tags: [comparison]
    question: "Confronta le zone di allerta delle ultime due analisi alluvione completate"
    expect:
      type: sql_result
      ordered: true
      gold_sql: >-
        SELECT a.analysis_id, s.total_area_ha FROM agent.analyses a
        JOIN agent.analysis_severity_summary s
          ON s.analysis_id = a.analysis_id AND s.severity_label = 'alert'
        WHERE a.algorithm = 'flood' AND a.status = 'completed'
        ORDER BY a.created_at DESC LIMIT 2
    scripted:
      - sql: >-
          SELECT a.analysis_id, sum(f.area_ha) AS ettari_allerta
          FROM agent.analyses a JOIN agent.alert_areas f ON f.analysis_id = a.analysis_id
          WHERE a.algorithm = 'flood' AND a.status = 'completed' AND f.severity = 3
          GROUP BY a.analysis_id, a.created_at ORDER BY a.created_at DESC LIMIT 2

  - id: en-sql-failed-why
    lang: en
    tags: [status]
    question: "Which analyses failed and why?"
    expect:
      type: sql_result
      gold_sql: "SELECT analysis_id, status_message FROM agent.analyses WHERE status = 'failed' LIMIT 50"
    scripted:
      - sql: "SELECT analysis_id, status_message AS reason FROM agent.analyses WHERE status = 'failed' LIMIT 20"

  - id: it-sql-allerta-per-localita
    lang: it
    tags: [aggregate, group]
    question: "Qual è la superficie totale delle zone di allerta mappate, in ettari, per località?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT location_name, sum(area_ha) FROM agent.alert_areas
        WHERE severity_label = 'alert' GROUP BY location_name LIMIT 50
    scripted:
      - sql: >-
          SELECT location_name, sum(total_area_ha) AS ettari FROM agent.analysis_severity_summary
          WHERE severity = 3 GROUP BY location_name ORDER BY ettari DESC LIMIT 50

  # A count of zones comes with the minimum zone size and the patches left out (data
  # agent rule 10); the hectares with it come from agent.severity_areas (HL 8.10 ha,
  # the two HL zones hold 6.5 ha).
  - id: en-sql-lisa-high-outliers
    lang: en
    tags: [aggregate, lisa, zones, severity-areas]
    question: "How many LISA high outliers (HL) are there, and what is their total area in hectares?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT count(*), a.min_zone_area_m2, a.small_patches_left_out,
               (SELECT sum(s.area_ha) FROM agent.severity_areas s
                WHERE s.analysis_id = a.analysis_id AND s.quadrant_label = 'HL')
        FROM agent.alert_areas f JOIN agent.analyses a ON a.analysis_id = f.analysis_id
        WHERE f.algorithm = 'lisa' AND f.quadrant_label = 'HL'
        GROUP BY a.analysis_id, a.min_zone_area_m2, a.small_patches_left_out
        LIMIT 10
    scripted:
      - sql: >-
          WITH zones AS (
            SELECT analysis_id, count(feature_id) AS n FROM agent.alert_areas
            WHERE algorithm = 'lisa' AND quadrant = 3 GROUP BY analysis_id)
          SELECT z.n AS hl_zones, a.min_zone_area_m2, a.small_patches_left_out,
                 sum(s.area_ha) AS hl_ha
          FROM zones z JOIN agent.analyses a ON a.analysis_id = z.analysis_id
          JOIN agent.severity_areas s ON s.analysis_id = z.analysis_id AND s.quadrant = 3
          GROUP BY z.n, a.min_zone_area_m2, a.small_patches_left_out
          LIMIT 10

  - id: it-sql-durata-media
    lang: it
    tags: [aggregate, time]
    question: "Quanto è durata in media l'elaborazione delle analisi completate, in secondi?"
    expect:
      type: sql_result
      gold_sql: "SELECT avg(processing_seconds) FROM agent.analyses WHERE status = 'completed' LIMIT 1"
    scripted:
      - sql: >-
          SELECT avg(extract(epoch FROM completed_at - created_at)) AS secondi
          FROM agent.analyses WHERE status = 'completed' LIMIT 1

  - id: en-sql-pending-retry-after-gate
    lang: en
    tags: [retry]
    question: "List the analyses that are still pending."
    expect:
      type: sql_result
      gold_sql: "SELECT analysis_id FROM agent.analyses WHERE status = 'pending' LIMIT 50"
    scripted:
      - sql: "SELECT analysis_id FROM analyses WHERE status = 'pending' LIMIT 50"      # unqualified: gate rejects
      - sql: "SELECT analysis_id FROM agent.analyses WHERE status = 'pending' LIMIT 50"

  - id: it-sql-poligoni-retry-after-db-error
    lang: it
    tags: [retry, zones]
    question: "Elenca le analisi di Testville North con il numero di poligoni di allerta"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT a.analysis_id, count(f.feature_id), a.min_zone_area_m2, a.small_patches_left_out
        FROM agent.analyses a
        LEFT JOIN agent.alert_areas f ON f.analysis_id = a.analysis_id
        WHERE a.location_name ILIKE '%testville north%'
        GROUP BY a.analysis_id, a.min_zone_area_m2, a.small_patches_left_out LIMIT 50
    scripted:
      - sql: >-
          SELECT a.analysis_id, count(f.polygon_id), a.min_zone_area_m2, a.small_patches_left_out
          FROM agent.analyses a
          LEFT JOIN agent.alert_areas f ON f.analysis_id = a.analysis_id
          WHERE a.location_name ILIKE '%testville north%'
          GROUP BY a.analysis_id, a.min_zone_area_m2, a.small_patches_left_out LIMIT 50
      - sql: >-
          SELECT a.analysis_id, count(f.feature_id) AS poligoni,
                 a.min_zone_area_m2 AS dimensione_minima_m2, a.small_patches_left_out AS macchie_escluse
          FROM agent.analyses a
          LEFT JOIN agent.alert_areas f ON f.analysis_id = a.analysis_id
          WHERE a.location_name ILIKE '%testville north%'
          GROUP BY a.analysis_id, a.min_zone_area_m2, a.small_patches_left_out LIMIT 50

  # Coverage: "why is only part of the area covered" must be answerable from rows
  # (coverage_pct, uncovered_masked_pct / uncovered_no_data_pct, scene counts).
  - id: en-sql-low-coverage-list
    lang: en
    tags: [coverage]
    question: "Which completed analyses cover only part of the requested area, and what share do they cover?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT analysis_id, coverage_pct FROM agent.analyses
        WHERE status = 'completed' AND low_coverage LIMIT 50
    scripted:
      - sql: >-
          SELECT analysis_id, coverage_pct AS covered_percent FROM agent.analyses
          WHERE coverage_pct < 80 ORDER BY coverage_pct LIMIT 50

  - id: it-sql-perche-copertura-parziale
    lang: it
    tags: [coverage]
    question: >-
      Perché l'ultima analisi NDVI copre solo una parte dell'area? Che percentuale è coperta,
      quanta è stata mascherata dalle nuvole e quanta era fuori dalle immagini?
    expect:
      type: sql_result
      gold_sql: >-
        SELECT coverage_pct, uncovered_masked_pct, uncovered_no_data_pct FROM agent.analyses
        WHERE algorithm = 'ndvi' ORDER BY created_at DESC LIMIT 1
    scripted:
      - sql: >-
          SELECT coverage_pct AS coperta, uncovered_masked_pct AS nuvole,
                 uncovered_no_data_pct AS fuori_immagini
          FROM agent.analyses WHERE algorithm = 'ndvi' AND status = 'completed'
          ORDER BY created_at DESC LIMIT 1

  # Index value distribution: area above / below / between thresholds of a continuous
  # index (agent.index_value_distribution). The threshold is returned as a column (data
  # agent rule 9), so it is part of the gold result. Seed intervals sit on the edges that
  # matter: 0.64 / 0.65 (ndvi 007), 0.49 / 0.50 (ndvi 007, 008), -0.01 / 0.00 (ndwi 009).
  - id: en-sql-ndvi-area-at-least-threshold
    lang: en
    tags: [distribution, threshold]
    question: "In the June 2025 NDVI analysis of Sample Plain, how many hectares have an NDVI of at least 0.4?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0.4 AS threshold, sum(d.area_ha) FROM agent.index_value_distribution d
        JOIN agent.analyses a ON a.analysis_id = d.analysis_id
        WHERE a.algorithm = 'ndvi' AND a.location_name ILIKE '%sample plain%'
          AND a.window_start < '2025-07-01' AND a.window_end > '2025-06-01'
          AND d.value_from >= 0.4
        LIMIT 1
    scripted:
      - sql: >-
          SELECT 0.40 AS threshold, sum(area_ha) AS hectares FROM agent.index_value_distribution
          WHERE value_from >= 0.40 AND analysis_id = (
            SELECT analysis_id FROM agent.analyses
            WHERE algorithm = 'ndvi' AND location_name ILIKE '%sample plain%'
              AND window_start >= '2025-05-31' AND window_end <= '2025-07-02'
            ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: it-sql-verde-soglia-predefinita
    lang: it
    tags: [distribution, default-threshold]
    question: "Quanti ettari di verde ci sono nell'ultima analisi NDVI di Sample Plain?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0.65 AS threshold, sum(area_ha) FROM agent.index_value_distribution
        WHERE value_from >= 0.65 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses
          WHERE algorithm = 'ndvi' AND location_name ILIKE '%sample plain%'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          WITH ultima AS (
            SELECT analysis_id FROM agent.analyses
            WHERE algorithm = 'ndvi' AND location_name ILIKE '%sample plain%' AND status = 'completed'
            ORDER BY created_at DESC LIMIT 1)
          SELECT 0.65 AS soglia, sum(d.area_ha) AS ettari_verdi
          FROM agent.index_value_distribution d JOIN ultima u ON u.analysis_id = d.analysis_id
          WHERE d.value_from >= 0.65
          LIMIT 1

  - id: it-sql-acqua-ultima-ndwi
    lang: it
    tags: [distribution, default-threshold, water]
    question: "Quanta acqua c'è nell'ultima analisi NDWI, in ettari?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0 AS threshold, sum(area_ha) FROM agent.index_value_distribution
        WHERE value_from >= 0 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses WHERE algorithm = 'ndwi'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT 0.0 AS soglia, sum(area_ha) FILTER (WHERE value_from >= 0) AS ettari_acqua
          FROM agent.index_value_distribution
          WHERE analysis_id = (SELECT analysis_id FROM agent.analyses WHERE algorithm = 'ndwi'
                               ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: en-sql-mndwi-water-share
    lang: en
    tags: [distribution, default-threshold, water, share]
    question: "What share of the covered area is water in the latest MNDWI analysis?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0 AS threshold, sum(pct_of_covered_area) FROM agent.index_value_distribution
        WHERE value_from >= 0 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses WHERE algorithm = 'mndwi'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT 0 AS threshold,
                 sum(CASE WHEN value_from >= 0 THEN pct_of_covered_area ELSE 0 END) AS water_pct
          FROM agent.index_value_distribution
          WHERE analysis_id = (SELECT analysis_id FROM agent.analyses WHERE algorithm = 'mndwi'
                               ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: it-sql-ndvi-intervallo
    lang: it
    tags: [distribution, range]
    question: "Quanti ettari dell'ultima analisi NDVI di Sample Plain hanno un NDVI tra 0,2 e 0,5?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0.2 AS threshold_from, 0.5 AS threshold_to, sum(area_ha)
        FROM agent.index_value_distribution
        WHERE value_from >= 0.2 AND value_to <= 0.5 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses
          WHERE algorithm = 'ndvi' AND location_name ILIKE '%sample plain%'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT 0.2 AS da, 0.5 AS a, sum(area_ha) AS ettari FROM agent.index_value_distribution
          WHERE value_from BETWEEN 0.2 AND 0.49 AND analysis_id = (
            SELECT analysis_id FROM agent.analyses
            WHERE algorithm = 'ndvi' AND location_name ILIKE '%sample plain%'
            ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: it-sql-confronto-verde-giugno-dicembre
    lang: it
    tags: [distribution, comparison]
    question: "Confronta l'area con NDVI almeno 0,65 delle analisi NDVI di Sample Plain di giugno e di dicembre 2025"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT a.analysis_id, 0.65 AS threshold, sum(d.area_ha)
        FROM agent.analyses a JOIN agent.index_value_distribution d ON d.analysis_id = a.analysis_id
        WHERE a.algorithm = 'ndvi' AND a.location_name ILIKE '%sample plain%' AND d.value_from >= 0.65
        GROUP BY a.analysis_id
        LIMIT 10
    scripted:
      - sql: >-
          SELECT analysis_id, 0.65 AS soglia, sum(area_ha) AS ettari
          FROM agent.index_value_distribution
          WHERE algorithm = 'ndvi' AND location_name ILIKE '%sample plain%' AND value_from >= 0.65
          GROUP BY analysis_id
          LIMIT 10

  # No distribution recorded (011 ran before it was): the area is unknown, not zero.
  # The gold result is (0, NULL); an answer of 0 hectares fails.
  - id: en-sql-water-no-distribution
    lang: en
    tags: [distribution, water, missing]
    question: "How much water, in hectares, is there in the NDWI analysis of Old Harbour?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0 AS threshold, sum(area_ha) FROM agent.index_value_distribution
        WHERE location_name ILIKE '%old harbour%' AND algorithm = 'ndwi' AND value_from >= 0
        LIMIT 1
    scripted:
      - sql: >-
          SELECT 0 AS threshold, sum(CASE WHEN value_from >= 0 THEN area_ha ELSE 0 END) AS water_ha
          FROM agent.index_value_distribution
          WHERE analysis_id = (SELECT analysis_id FROM agent.analyses
                               WHERE algorithm = 'ndwi' AND location_name ILIKE '%old harbour%'
                               ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  # Low coverage (004 covers 41.5 %): the area describes only the covered part, so the
  # answer carries coverage_pct with it.
  - id: en-sql-green-low-coverage
    lang: en
    tags: [distribution, default-threshold, coverage]
    question: "How many hectares of dense green vegetation are in the latest NDVI analysis, and how much of the area did it cover?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT 0.65 AS threshold, sum(d.area_ha), a.coverage_pct
        FROM agent.analyses a JOIN agent.index_value_distribution d ON d.analysis_id = a.analysis_id
        WHERE d.value_from >= 0.65 AND a.analysis_id = (
          SELECT analysis_id FROM agent.analyses WHERE algorithm = 'ndvi'
          ORDER BY created_at DESC LIMIT 1)
        GROUP BY a.coverage_pct
        LIMIT 1
    scripted:
      - sql: >-
          WITH latest AS (
            SELECT analysis_id, coverage_pct FROM agent.analyses WHERE algorithm = 'ndvi'
            ORDER BY created_at DESC LIMIT 1)
          SELECT 0.65 AS threshold,
                 (SELECT sum(d.area_ha) FROM agent.index_value_distribution d
                  WHERE d.analysis_id = l.analysis_id AND d.value_from >= 0.65) AS green_ha,
                 l.coverage_pct
          FROM latest l
          LIMIT 1

  # Flood and LISA areas (agent.severity_areas: every covered pixel of each class) and
  # zone counts (agent.alert_areas, returned with agent.analyses min_zone_area_m2 and
  # small_patches_left_out: data agent rule 10). 001 (flood) ran before either was
  # recorded: its areas are NULL, not 0. Seed figures: header of the seed file.
  - id: en-sql-lisa-anomaly-count
    lang: en
    tags: [lisa, zones]
    question: "How many anomalies did the latest LISA analysis find?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT count(f.feature_id), a.min_zone_area_m2, a.small_patches_left_out
        FROM agent.analyses a LEFT JOIN agent.alert_areas f ON f.analysis_id = a.analysis_id
        WHERE a.analysis_id = (SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa'
                               ORDER BY created_at DESC LIMIT 1)
        GROUP BY a.min_zone_area_m2, a.small_patches_left_out
        LIMIT 1
    scripted:
      - sql: >-
          WITH latest AS (
            SELECT analysis_id, min_zone_area_m2, small_patches_left_out FROM agent.analyses
            WHERE algorithm = 'lisa' AND status = 'completed' ORDER BY created_at DESC LIMIT 1)
          SELECT (SELECT count(*) FROM agent.alert_areas f WHERE f.analysis_id = l.analysis_id) AS zones,
                 l.min_zone_area_m2, l.small_patches_left_out
          FROM latest l
          LIMIT 1

  - id: it-sql-ettari-anomalie-lisa
    lang: it
    tags: [lisa, severity-areas, share]
    question: "Quanti ettari di anomalie ci sono nell'ultima analisi LISA, e che percentuale dell'area coperta rappresentano?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT sum(area_ha), sum(pct_of_covered_area) FROM agent.severity_areas
        WHERE severity >= 1 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT sum(s.area_ha) AS ettari_anomalie, sum(s.pct_of_covered_area) AS percentuale_coperta
          FROM agent.severity_areas s
          WHERE s.severity_label IN ('watch', 'suspect', 'alert') AND s.analysis_id = (
            SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa' AND status = 'completed'
            ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: it-sql-quota-vegetazione-anomala
    lang: it
    tags: [lisa, severity-areas, share, vegetated]
    question: "Che percentuale della vegetazione è anomala nell'ultima analisi LISA di Sample Plain?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT sum(pct_of_vegetated_area) FROM agent.severity_areas
        WHERE severity >= 1 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses
          WHERE algorithm = 'lisa' AND location_name ILIKE '%sample plain%'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT sum(pct_of_vegetated_area) FILTER (WHERE severity > 0) AS quota_vegetazione_anomala
          FROM agent.severity_areas
          WHERE location_name ILIKE '%sample plain%' AND analysis_id = (
            SELECT analysis_id FROM agent.analyses
            WHERE algorithm = 'lisa' AND location_name ILIKE '%sample plain%'
            ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  - id: en-sql-lisa-zones-by-quadrant
    lang: en
    tags: [lisa, zones, quadrant]
    question: "In the latest LISA analysis, how many mapped zones are high outliers and how many are low outliers?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT f.quadrant_label, count(*), a.min_zone_area_m2, a.small_patches_left_out
        FROM agent.alert_areas f JOIN agent.analyses a ON a.analysis_id = f.analysis_id
        WHERE f.analysis_id = (SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa'
                               ORDER BY created_at DESC LIMIT 1)
        GROUP BY f.quadrant_label, a.min_zone_area_m2, a.small_patches_left_out
        LIMIT 10
    scripted:
      - sql: >-
          SELECT f.quadrant_label AS outlier, count(f.feature_id) AS zones,
                 min(a.min_zone_area_m2) AS min_zone_m2, min(a.small_patches_left_out) AS small_patches
          FROM agent.alert_areas f JOIN agent.analyses a ON a.analysis_id = f.analysis_id
          WHERE f.quadrant_label IN ('HL', 'LH') AND f.analysis_id = (
            SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa'
            ORDER BY created_at DESC LIMIT 1)
          GROUP BY f.quadrant_label
          LIMIT 10

  - id: it-sql-ettari-per-quadrante
    lang: it
    tags: [lisa, severity-areas, quadrant]
    question: "Quanti ettari di anomalie HL e quanti di anomalie LH ci sono nell'ultima analisi LISA?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT quadrant_label, sum(area_ha) FROM agent.severity_areas
        WHERE severity >= 1 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa'
          ORDER BY created_at DESC LIMIT 1)
        GROUP BY quadrant_label
        LIMIT 10
    scripted:
      - sql: >-
          SELECT quadrant_label AS quadrante, sum(area_ha) AS ettari FROM agent.severity_areas
          WHERE quadrant IN (3, 4) AND analysis_id = (
            SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa' AND status = 'completed'
            ORDER BY created_at DESC LIMIT 1)
          GROUP BY quadrant_label
          LIMIT 10

  - id: en-sql-flood-water-ha-share
    lang: en
    tags: [flood, severity-areas, water, share]
    question: "How much water did the latest completed flood analysis detect, in hectares and as a share of the covered area?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT sum(area_ha), sum(pct_of_covered_area) FROM agent.severity_areas
        WHERE severity >= 1 AND analysis_id = (
          SELECT analysis_id FROM agent.analyses
          WHERE algorithm = 'flood' AND status = 'completed'
          ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          SELECT sum(area_ha) FILTER (WHERE severity > 0) AS water_ha,
                 sum(pct_of_covered_area) FILTER (WHERE severity > 0) AS water_pct
          FROM agent.severity_areas
          WHERE analysis_id = (
            SELECT analysis_id FROM agent.analyses
            WHERE algorithm = 'flood' AND status = 'completed'
            ORDER BY created_at DESC LIMIT 1)
          LIMIT 1

  # 001 ran before class areas were recorded: the water area is not available. The gold
  # result is NULL; 0 fails, and so does the zone total (13 ha) given in its place.
  - id: it-sql-acqua-alluvione-non-disponibile
    lang: it
    tags: [flood, severity-areas, water, missing]
    question: "Quanti ettari di acqua ha rilevato l'analisi alluvione 00000000-0000-4000-a000-000000000001?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT sum(area_ha) FROM agent.severity_areas
        WHERE analysis_id = '00000000-0000-4000-a000-000000000001' AND severity >= 1
        LIMIT 1
    scripted:
      - sql: >-
          SELECT sum(CASE WHEN severity > 0 THEN area_ha ELSE 0 END) AS ettari_acqua
          FROM agent.severity_areas
          WHERE analysis_id = '00000000-0000-4000-a000-000000000001'
          LIMIT 1

  # Both figures must be right: 1 alert zone (of at least 400 m2, 131 smaller patches
  # left out) and 6.52 ha at alert severity (the zone alone holds 6 ha).
  - id: en-sql-alert-zones-and-area
    lang: en
    tags: [lisa, zones, severity-areas]
    question: "How many alert zones did the latest LISA analysis map, and how many hectares are at alert severity in it?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT (SELECT count(*) FROM agent.alert_areas f
                WHERE f.analysis_id = a.analysis_id AND f.severity_label = 'alert'),
               a.min_zone_area_m2, a.small_patches_left_out,
               (SELECT sum(s.area_ha) FROM agent.severity_areas s
                WHERE s.analysis_id = a.analysis_id AND s.severity_label = 'alert')
        FROM agent.analyses a
        WHERE a.analysis_id = (SELECT analysis_id FROM agent.analyses WHERE algorithm = 'lisa'
                               ORDER BY created_at DESC LIMIT 1)
        LIMIT 1
    scripted:
      - sql: >-
          WITH latest AS (
            SELECT analysis_id, min_zone_area_m2, small_patches_left_out FROM agent.analyses
            WHERE algorithm = 'lisa' AND status = 'completed' ORDER BY created_at DESC LIMIT 1),
          zones AS (
            SELECT count(*) AS n FROM agent.alert_areas
            WHERE severity = 3 AND analysis_id = (SELECT analysis_id FROM latest)),
          area AS (
            SELECT sum(area_ha) AS ha FROM agent.severity_areas
            WHERE severity = 3 AND analysis_id = (SELECT analysis_id FROM latest))
          SELECT z.n AS alert_zones, l.min_zone_area_m2, l.small_patches_left_out, r.ha AS alert_ha
          FROM latest l, zones z, area r
          LIMIT 1

  # 001 has its zones but not their minimum size: the count is given, the size is NULL.
  - id: it-sql-zone-alluvione-senza-dimensione
    lang: it
    tags: [flood, zones, missing]
    question: "Quante zone ha mappato l'analisi alluvione 00000000-0000-4000-a000-000000000001, e di che dimensione minima?"
    expect:
      type: sql_result
      gold_sql: >-
        SELECT count(f.feature_id), a.min_zone_area_m2, a.small_patches_left_out
        FROM agent.analyses a LEFT JOIN agent.alert_areas f ON f.analysis_id = a.analysis_id
        WHERE a.analysis_id = '00000000-0000-4000-a000-000000000001'
        GROUP BY a.min_zone_area_m2, a.small_patches_left_out
        LIMIT 1
    scripted:
      - sql: >-
          SELECT count(*) AS zone, max(a.min_zone_area_m2) AS dimensione_minima_m2,
                 max(a.small_patches_left_out) AS macchie_escluse
          FROM agent.alert_areas f JOIN agent.analyses a ON a.analysis_id = f.analysis_id
          WHERE f.analysis_id = '00000000-0000-4000-a000-000000000001'
          LIMIT 1

