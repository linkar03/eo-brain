name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    name: agent tests + scripted tool eval (no network, no DB, no LLM)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # same as the api Dockerfile
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r ../requirements-ci.txt
      - name: Offline tests
        run: >-
          python -m pytest -q
          tests/test_agent_validators.py tests/test_agent_geocoder.py tests/test_agent_session.py
          tests/test_agent_brain.py tests/test_agent_gemini_provider.py tests/test_evals.py
          tests/test_sql_gate.py tests/test_data_agent.py tests/test_sql_evals.py tests/test_eval_completeness.py
          tests/test_scenes.py tests/test_radiometry.py
      - name: Scripted tool-call eval (plumbing check, NOT model quality)
        run: python -m evals.run --provider scripted --suite tools

  database:
    name: DB isolation tests + scripted SQL eval (PostGIS service)
    runs-on: ubuntu-latest
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - run: pip install -r ../requirements-ci.txt
      - name: DB-backed tests (role isolation, executor, data agent end to end, view value lists)
        run: python -m pytest -q -m db tests/test_db_agent.py tests/test_sql_evals.py tests/test_db_view_values.py
      - name: Scripted SQL eval (plumbing + gate + role check, NOT model quality)
        run: python -m evals.run --provider scripted --suite sql

  original:
    name: original test suite + tile server (full requirements.txt, no network, no DB)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"   # same as the api Dockerfile
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r ../requirements.txt
      - name: Original tests (algorithms, API validation, data cube, vectorisation, tile server, scene selection)
        run: >-
          python -m pytest -q
          tests/test_algorithms.py tests/test_api.py tests/test_datacube.py
          tests/test_vectorize.py tests/test_tiles.py tests/test_scenes.py

  frontend:
    name: frontend type check + unit tests (push-to-talk, mocked recogniser) + build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"   # same as the frontend Dockerfile
      # No lockfile in the repository, so no npm cache: npm resolves package.json on every run.
      - run: npm install --no-audit --no-fund
      - name: Type check
        run: npx tsc --noEmit
      - name: Unit tests (Vitest, happy-dom)
        run: npm test
      - name: Production build
        run: npx vite build
